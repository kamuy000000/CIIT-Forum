<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "top-bar">
        <h1>
            FORUM
        </h1>
        <div class="off-screen-menu">
            <ul>
                <button type = "button" class="loginButton" onclick = "window.location.href='login.php'">login</button>
                <button type = "button" class="searchButton" onclick = "window.location.href='search.php'">search</button>
            </ul>
        </div>
                <nav>
            <div class="ham-menu">
                <span></span>
                <span></span>
                <span></span>  
            </div>
        </nav>
    </div>
    <div class = "main">
        <div class= "header"> </div>
        <textarea></textarea>
        <button type ="button" id="commentButton">add comment</button>
        <div class= "comments"></div>
    </div>
    <script src="data.js"></script>
    <script>
      var id = window.location.search.slice(1).split("=")[1];
        var thread = threads.find(t => t.id == id);
        var header = document.querySelector('.header');
        var headerHtml = `          
        <h4 class = "title">
                    ${thread.title}
                </h4>
                <div class = "bottom">
                    <p class = "description">
                        ${thread.description}
                    </p>
                </div> 
                `
        header.insertAdjacentHTML('beforeend', headerHtml) 

        function addComment(comment) {
        comment.replies = comment.replies || [];
        var commentHtml = `
            <div class = "comment">
                <div class ="top-comment">
                    <p class = "user">
                        ${comment.author}
                    </p>
                    <p class="comment-ts">
                        ${new Date(comment.date).toLocaleString()}
                    </p>
                </div>
                <div class ="comment-content">
                    ${comment.content}
                </div>
                <button type= "button" class="replyButton">Reply</button>
                <div class="reply-form" hidden>
                    <textarea class="reply-text"></textarea>
                    <button type="button" class="submit-reply">Add reply</button>
                </div>
                <div class="replies">
                    ${comment.replies.map(reply => `
                        <div class="reply">
                            <div class="top-reply">
                                <p class="user">${reply.author}</p>
                                <p class="reply-ts">${new Date(reply.date).toLocaleString()}</p>
                            </div>
                            <div class="reply-content">
                                ${reply.content}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
            `
            comments.insertAdjacentHTML('beforeend', commentHtml);
        }
        

        var comments = document.querySelector('.comments');
        for (let comment of thread.comments) {
            addComment(comment);
        }

        var btn = document.querySelector('#commentButton');
        var textarea = document.querySelector('textarea');
        btn.disabled = textarea.value.trim() === "";
        textarea.addEventListener('input', function() {
            btn.disabled = textarea.value.trim() === "";
        });
        btn.addEventListener('click', function() {
            var txt = textarea.value.trim();
            if (txt === "") {
                btn.disabled = true;
                return;
            }
            var comment = {
                content: txt,
                date: Date.now(),
                author: "User",
                replies: []
            }
            addComment(comment);
            textarea.value = "";
            btn.disabled = true;
            thread.comments.push(comment);
            localStorage.setItem("threads", JSON.stringify(threads));
        });

           var commentElements = document.querySelectorAll('.comment');
        commentElements.forEach(commentElement => {
            var replyButton = commentElement.querySelector('.replyButton');
            var replyForm = commentElement.querySelector('.reply-form');
            var submitReplyButton = commentElement.querySelector('.submit-reply');
            var replyTextarea = commentElement.querySelector('.reply-text');
            var repliesContainer = commentElement.querySelector('.replies');

            replyButton.addEventListener('click', function() {
                replyForm.hidden = !replyForm.hidden;
            });

            submitReplyButton.addEventListener('click', function() {
                var replyContent = replyTextarea.value.trim();
                if (replyContent === "") {
                    return;
                }
                var reply = {
                    content: replyContent,
                    date: Date.now(),
                    author: "User"
                };
                comment.replies.push(reply);
                localStorage.setItem("threads", JSON.stringify(threads));
                var replyElement = document.createElement("div");
                replyElement.className = "reply";
                replyElement.innerHTML = `
                    <div class="top-reply">
                        <p class="user">${reply.author}</p>
                        <p class="reply-ts">${new Date(reply.date).toLocaleString()}</p>
                    </div>
                    <div class="reply-content">
                        ${reply.content}
                    </div>
                `;
                repliesContainer.append(replyElement);
                replyTextarea.value = "";
                replyForm.hidden = true;
            });
        });

    </script>
</body>
